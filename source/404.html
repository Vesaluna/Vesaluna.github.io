<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <link rel="icon" href="/images/favicon.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: #2e405b;
      font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", "PingFang SC", sans-serif;
      line-height: 1.75;
      background: #fff url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAMCAYAAABWdVznAAAAGXRFWHRTb2Z0d2FyZQBBZG9iZSBJbWFnZVJlYWR5ccllPAAAACFJREFUeNpiZGBg4GegAsBlCD8TqSYNQg2Mo6FEBAAIMACdPABtrSW/IQAAAABJRU5ErkJggg==") repeat fixed;
    }
    main {
      max-width: 34rem;
      width: 100%;
      padding: 2.25rem 2rem;
      border-left: 2px solid #2e405b;
      background: rgba(255, 255, 255, 0.88);
    }
    .code {
      margin: 0 0 0.4rem;
      font-size: 3rem;
      font-weight: 700;
      line-height: 1;
      font-family: "HiraMinProN-W6", "Source Han Serif CN", "Source Han Serif SC", serif;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: 1.3rem;
      font-weight: 600;
    }
    p {
      margin: 0 0 0.85rem;
      font-size: 0.96rem;
      color: rgba(46, 64, 91, 0.82);
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      margin-top: 1.5rem;
      font-weight: 600;
    }
    a {
      color: #2e405b;
      text-decoration: none;
      border-bottom: 2px solid #2e405b;
      transition: color 0.25s ease, background-color 0.25s ease;
    }
    a:hover, a:focus-visible {
      color: #fff;
      background-color: #2e405b;
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>页面未找到 · Page Not Found · Pagina non trovata</h1>
    <p>你要访问的页面不存在或已被移动。</p>
    <p>The page you are looking for does not exist or has been moved.</p>
    <p>La pagina che stai cercando non esiste o è stata spostata.</p>
    <nav aria-label="Navigation">

      <a href="/search/">搜索</a>
