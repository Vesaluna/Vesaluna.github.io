- zh-cn: 惟願有一天能像你一樣，成為照亮他人的光芒。
  en: May I one day become, like you, a light that illuminates others.
  it: Possa anch'io, un giorno, diventare come te una luce capace di illuminare gli altri.
- zh-cn: 快來吧，悲傷，化作我的雙翼；快來吧，傷痕，成為我的羅盤。
  en: Come, sorrow, and become my wings; come, scars, and become my compass.
  it: Vieni, tristezza, e diventa le mie ali; venite, cicatrici, e diventate la mia bussola.
- zh-cn: 不願成為一張充滿了無盡枷鎖的白紙。
  en: I do not wish to become a blank page bound by endless chains.
  it: Non voglio diventare una pagina bianca stretta da infinite catene.
- zh-cn: 我的太陽，請你看著我。
  en: My sun, please look at me.
  it: Sole mio, ti prego, guardami.
- zh-cn: 何時能夠對抗我所目及的一切悲哀，渴望著那樣魔法。
  en: I long for a magic that could one day stand against all the sorrow I see.
  it: Desidero una magia capace, un giorno, di opporsi a tutta la tristezza che vedo.
- zh-cn: EL PSY KONGROO
  en: EL PSY KONGROO
  it: EL PSY KONGROO
- zh-cn: 美麗之物采擷世間之美，正是眾生降臨的意義
  en: Beautiful beings gather the beauty of the world; this is the meaning of every life’s arrival.
  it: 'Le creature belle raccolgono la bellezza del mondo: in questo sta il senso della venuta al mondo di ogni essere vivente.'
